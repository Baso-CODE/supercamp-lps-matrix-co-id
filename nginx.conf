
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ==========================================
    # GZIP COMPRESSION
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ==========================================
    # VITE HASHED ASSETS
    # ==========================================
    location ^~ /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================
    # STATIC IMAGES
    # ==========================================
    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;

        expires 7d;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================
    # FONTS
    # ==========================================
    location ~* \.(woff|woff2|ttf|otf)$ {
        try_files $uri =404;

        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================
    # MANIFEST & OTHER STATIC FILES
    # ==========================================
    location ~* \.(json|xml|txt|webmanifest)$ {
        try_files $uri =404;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================
    # INDEX.HTML - NO CACHE
    # ==========================================
    location = /index.html {
        try_files $uri =404;

        expires off;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ==========================================
    # REACT ROUTER SPA FALLBACK
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;

        expires off;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
